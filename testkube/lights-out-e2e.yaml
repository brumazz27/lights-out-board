# Runs the Playwright end-to-end suite for the Lights Out Board.
# The tests start their own copy of the page inside the runner pod, so nothing has to be deployed first.
#
#   testkube create testworkflow -f testkube/lights-out-e2e.yaml
#   testkube run testworkflow lights-out-e2e -f
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: lights-out-e2e
  labels:
    app: lights-out-board
    tool: playwright
spec:
  content:
    git:
      uri: https://github.com/brumazz27/lights-out-board
      revision: main
  config:
    project:
      type: string
      default: all
      description: Which Playwright project to run (all, desktop or phone)
    baseUrl:
      type: string
      default: ""
      description: Test an already running copy instead of the bundled server (for example http://lights-out.default.svc)
  container:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    workingDir: /data/repo
    env:
    # git and npm write config and caches under $HOME; "/" isn't writable in the runner pod.
    - name: HOME
      value: /tmp
    - name: CI
      value: "true"
    - name: BASE_URL
      value: "{{ config.baseUrl }}"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  steps:
  - name: Install dependencies
    shell: npm ci --no-audit --no-fund
  - name: Run Playwright tests
    shell: |
      if [ "{{ config.project }}" = "all" ]; then
        npx playwright test
      else
        npx playwright test --project "{{ config.project }}"
      fi
  - name: Save test report
    condition: always
    artifacts:
      paths:
      - test-results/**
      - playwright-report/**
